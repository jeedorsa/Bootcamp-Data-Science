services:
  # Ollama: servidor LLM local
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 12G   # ajustar segun RAM disponible. Llama 3 8B necesita ~8 GB
        reservations:
          memory: 8G

  # Gateway FastAPI que recibe requests y los reenvia a Ollama
  gateway:
    build: ./gateway
    container_name: ollama-gateway
    ports:
      - "8001:8001"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - DEFAULT_MODEL=llama3
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_models:
    driver: local
